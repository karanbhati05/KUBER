<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUBER - Strict Backend Authentication</title>
    
    <!-- Google Fonts: Outfit, Inter & Space Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="uber-theme login-page-body">

    <div class="login-page-container">
        <div class="login-modal-card">
            
            <div class="brand-header text-center">
                <div class="uber-logo">KUBER</div>
                <p class="brand-subtitle">Strict FastAPI Backend & Aiven MySQL Shard Auth</p>
            </div>

            <!-- Mode Switcher: Sign In vs Create Account -->
            <div class="auth-mode-tabs">
                <button id="tab-mode-signin" class="mode-tab active">Sign In</button>
                <button id="tab-mode-register" class="mode-tab">Create Account</button>
            </div>

            <!-- Role Selector Bar -->
            <div class="uber-role-grid">
                <div class="role-tile active" data-role="rider">
                    <div class="tile-icon"><i class="fa-solid fa-user-large"></i></div>
                    <div class="tile-info">
                        <h3>Rider</h3>
                        <span>Book & Track</span>
                    </div>
                </div>
                <div class="role-tile" data-role="driver">
                    <div class="tile-icon"><i class="fa-solid fa-taxi"></i></div>
                    <div class="tile-info">
                        <h3>Driver</h3>
                        <span>Biometrics</span>
                    </div>
                </div>
                <div class="role-tile" data-role="admin">
                    <div class="tile-icon"><i class="fa-solid fa-sliders"></i></div>
                    <div class="tile-info">
                        <h3>Admin Ops</h3>
                        <span>Shards & ML</span>
                    </div>
                </div>
            </div>

            <!-- Backend Connection Status Indicator -->
            <div id="backend-health-box" class="bio-prompt-box">
                <i class="fa-solid fa-server"></i>
                <div>
                    <strong id="backend-health-title">Connecting to FastAPI Auth Engine (Port 8006)...</strong>
                    <p id="backend-health-sub">Target: Aiven Cloud MySQL Shards</p>
                </div>
            </div>

            <!-- Notification Banner -->
            <div id="auth-status-msg" class="auth-status-banner" style="display:none;"></div>

            <!-- FORM 1: STRICT SIGN IN -->
            <form id="form-signin" class="login-form active">
                <div class="input-field-group">
                    <label>Email Address</label>
                    <input type="email" id="signin-email" class="uber-input" value="rider_karan@gmail.com" required>
                </div>
                <div class="input-field-group">
                    <label>Password</label>
                    <input type="password" id="signin-password" class="uber-input" value="password123" required>
                </div>
                <button type="submit" id="btn-submit-signin" class="btn-uber-black btn-full glow-btn">
                    <span>Authenticate via FastAPI Backend</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <!-- FORM 2: STRICT CREATE ACCOUNT (REGISTRATION) -->
            <form id="form-register" class="login-form">
                <div class="input-field-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-name" class="uber-input" placeholder="e.g. Rahul Sharma" required>
                </div>
                <div class="input-field-group">
                    <label>Email Address</label>
                    <input type="email" id="reg-email" class="uber-input" placeholder="e.g. rahul@gmail.com" required>
                </div>
                <div class="input-field-group">
                    <label>Create Password</label>
                    <input type="password" id="reg-password" class="uber-input" placeholder="At least 6 characters" required>
                </div>
                <button type="submit" id="btn-submit-register" class="btn-uber-green btn-full glow-btn">
                    <span>Register to Aiven MySQL Shard DB</span>
                    <i class="fa-solid fa-user-plus"></i>
                </button>
            </form>

        </div>
    </div>

    <!-- Strict Backend Auth Script -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let currentRole = "rider";

            const tabSignIn = document.getElementById('tab-mode-signin');
            const tabRegister = document.getElementById('tab-mode-register');
            const formSignIn = document.getElementById('form-signin');
            const formRegister = document.getElementById('form-register');
            const statusMsg = document.getElementById('auth-status-msg');
            const healthTitle = document.getElementById('backend-health-title');
            const healthSub = document.getElementById('backend-health-sub');

            // Check FastAPI Backend Health
            async function checkBackendHealth() {
                try {
                    const res = await fetch('http://localhost:8006/auth/me', { method: 'GET' });
                    healthTitle.innerText = "🟢 FastAPI Auth Engine Online (Port 8006)";
                    healthSub.innerText = "Connected to Aiven MySQL Shards (kuber_db_mumbai / delhi)";
                    healthTitle.style.color = "#06C167";
                } catch (e) {
                    healthTitle.innerText = "🔴 FastAPI Auth Engine Offline (Port 8006)";
                    healthSub.innerText = "Run: python services/auth_engine/main.py or docker-compose up";
                    healthTitle.style.color = "#ff0844";
                }
            }
            checkBackendHealth();

            // Mode Switcher Handler
            tabSignIn.addEventListener('click', () => {
                tabSignIn.classList.add('active');
                tabRegister.classList.remove('active');
                formSignIn.classList.add('active');
                formRegister.classList.remove('active');
            });

            tabRegister.addEventListener('click', () => {
                tabRegister.classList.add('active');
                tabSignIn.classList.remove('active');
                formRegister.classList.add('active');
                formSignIn.classList.remove('active');
            });

            // Role Selector Cards
            document.querySelectorAll('.role-tile').forEach(tile => {
                tile.addEventListener('click', () => {
                    document.querySelectorAll('.role-tile').forEach(t => t.classList.remove('active'));
                    tile.classList.add('active');
                    currentRole = tile.getAttribute('data-role');
                });
            });

            function showStatus(text, isError = false) {
                statusMsg.style.display = "block";
                statusMsg.style.borderColor = isError ? "#ff0844" : "#06C167";
                statusMsg.style.color = isError ? "#ff0844" : "#06C167";
                statusMsg.style.background = isError ? "rgba(255,8,68,0.15)" : "rgba(6,193,103,0.15)";
                statusMsg.innerHTML = text;
            }

            // 1. STRICT SIGN IN
            formSignIn.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('signin-email').value;
                const password = document.getElementById('signin-password').value;

                showStatus("⌛ Sending request to FastAPI Auth Backend (http://localhost:8006/auth/login)...");

                try {
                    const res = await fetch('http://localhost:8006/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email, password: password })
                    });

                    if (res.ok) {
                        const data = await res.json();
                        const session = {
                            role: data.role.toLowerCase(),
                            email: data.email,
                            name: data.full_name,
                            user_id: data.user_id,
                            token: data.access_token
                        };
                        localStorage.setItem('kuber_auth_session', JSON.stringify(session));
                        showStatus(`✅ Authenticated via FastAPI Backend! Welcome ${data.full_name}. Redirecting...`);
                        
                        setTimeout(() => {
                            window.location.href = "index.html";
                        }, 800);
                    } else {
                        const errData = await res.json().catch(() => ({ detail: "Invalid credentials" }));
                        showStatus(`❌ Login Failed: ${errData.detail || "Invalid Email or Password"}. Access Denied.`, true);
                    }
                } catch (e) {
                    showStatus("❌ Connection Error: Cannot reach FastAPI Auth Engine at http://localhost:8006. Please start the backend service: <code>uvicorn main:app --port 8006</code> inside <code>services/auth_engine/</code>.", true);
                }
            });

            // 2. STRICT REGISTRATION
            formRegister.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('reg-name').value;
                const email = document.getElementById('reg-email').value;
                const password = document.getElementById('reg-password').value;

                showStatus("⌛ Registering account via FastAPI Auth Engine (http://localhost:8006/auth/register)...");

                try {
                    const res = await fetch('http://localhost:8006/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: email,
                            password: password,
                            full_name: name,
                            role: currentRole.toUpperCase()
                        })
                    });

                    if (res.ok) {
                        const data = await res.json();
                        showStatus(`✅ Registration Successful! Account created in Aiven MySQL Shard DB for '${data.full_name}'. Please Sign In now.`);
                        
                        // Switch to Sign In Tab with prefilled email
                        setTimeout(() => {
                            tabSignIn.click();
                            document.getElementById('signin-email').value = email;
                        }, 1200);
                    } else {
                        const errData = await res.json().catch(() => ({ detail: "Registration error" }));
                        showStatus(`❌ Registration Failed: ${errData.detail || "Could not create user account"}.`, true);
                    }
                } catch (e) {
                    showStatus("❌ Connection Error: Cannot reach FastAPI Auth Engine at http://localhost:8006. Please start the backend service: <code>uvicorn main:app --port 8006</code> inside <code>services/auth_engine/</code>.", true);
                }
            });
        });
    </script>
</body>
</html>
