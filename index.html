<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUBER - Distributed Platform</title>
    
    <!-- Google Fonts: Outfit, Inter & Space Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Production Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- Official Clerk JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" crossorigin="anonymous"></script>
</head>
<body class="uber-theme">

    <div id="app">
        <!-- 1. AUTHENTICATION VIEW (SHOWN WHEN SIGNED OUT) -->
        <div id="auth-viewport" class="auth-page-container">
            <div class="auth-wrapper-card">
                
                <div class="uber-brand-header text-center">
                    <div class="uber-logo">KUBER</div>
                    <p class="uber-brand-sub">Enterprise Distributed Platform • Auth & Registration</p>
                </div>

                <!-- OFFICIAL CLERK SIGN-IN COMPONENT MOUNT DIV -->

                <div id="sign-in" style="min-height:340px;display:flex;align-items:center;justify-content:center;">
                    <div style="text-align:center;color:#A6A6A6;font-size:13px;">
                        <i class="fa-solid fa-circle-notch fa-spin" style="font-size:24px;color:#06C167;margin-bottom:10px;"></i>
                        <p>Loading Official Clerk Sign-In Engine...</p>
                    </div>
                </div>

            </div>
        </div>

        <!-- 2. AUTHENTICATED UBER DASHBOARD VIEW (SHOWN WHEN SIGNED IN) -->
        <div id="dashboard-viewport" class="app-root" style="display:none;">
            <header class="uber-header">
                <div class="header-left">
                    <div class="brand-logo">KUBER</div>
                    <div class="nav-line"></div>
                    <div class="region-buttons">
                        <button class="region-chip active" data-region="mumbai">🟢 Mumbai Shard</button>
                        <button class="region-chip" data-region="delhi">🟢 Delhi Shard</button>
                    </div>
                </div>

                <div class="header-right">
                    <!-- Clerk Official User Button Div -->
                    <div id="user-button"></div>
                </div>
            </header>

            <main class="main-viewport">
                <aside class="sidebar-panel">
                    <div class="tab-nav">
                        <button class="tab-btn active" data-tab="booking">🚗 Ride</button>
                        <button class="tab-btn" data-tab="driver">🛺 Driver Shift</button>
                        <button class="tab-btn" data-tab="admin">⚙️ Cluster Ops</button>
                    </div>

                    <div id="tab-booking-content">
                        <div class="card-box">
                            <h2 class="card-title">Request a Ride</h2>
                            
                            <div class="select-wrap">
                                <label>Pickup Location</label>
                                <select id="select-pickup" class="uber-select-input">
                                    <option value="bkc">Bandra Kurla Complex (BKC), Mumbai</option>
                                    <option value="airport">Mumbai Airport T2</option>
                                    <option value="colaba">Gateway of India, Colaba</option>
                                    <option value="connaught">Connaught Place, New Delhi</option>
                                </select>
                            </div>

                            <div class="select-wrap">
                                <label>Destination</label>
                                <select id="select-drop" class="uber-select-input">
                                    <option value="airport">Mumbai Airport T2</option>
                                    <option value="bkc">Bandra Kurla Complex (BKC)</option>
                                    <option value="colaba">Gateway of India, Colaba</option>
                                    <option value="delhi_airport">IGI Airport T3, Delhi</option>
                                </select>
                            </div>
                        </div>

                        <div class="surge-banner-box">
                            <div>
                                <strong style="font-size:13px;display:block;">⚡ High Demand Area</strong>
                                <span style="font-size:11px;opacity:0.85;">Scikit-Learn RandomForest Model</span>
                            </div>
                            <strong id="surge-tag" style="font-size:14px;background:rgba(0,0,0,0.4);padding:4px 10px;border-radius:12px;">1.8x</strong>
                        </div>

                        <div class="card-box">
                            <span style="font-size:11px;color:#A6A6A6;font-weight:600;display:block;margin-bottom:10px;">SUGGESTED RIDES</span>

                            <div class="ride-item-card active" data-ride="uberx">
                                <span style="font-size:24px;">🚗</span>
                                <div style="flex:1;">
                                    <strong>UberX</strong>
                                    <p style="font-size:12px;color:#A6A6A6;">Affordable rides</p>
                                </div>
                                <span id="price-uberx" class="price-text">₹180</span>
                            </div>

                            <div class="ride-item-card" data-ride="black">
                                <span style="font-size:24px;">🚘</span>
                                <div style="flex:1;">
                                    <strong>Uber Black</strong>
                                    <p style="font-size:12px;color:#A6A6A6;">Luxury sedans</p>
                                </div>
                                <span id="price-black" class="price-text">₹420</span>
                            </div>
                        </div>

                        <button id="btn-request-ride" class="cta-btn">Request UberX</button>
                    </div>
                </aside>

                <section class="map-view">
                    <div id="leaflet-map" style="width:100%;height:100%;"></div>
                    <div class="map-badge">
                        <span>Geohash Grid: <strong className="code-font">te7udw</strong></span>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- OFFICIAL CLERK SDK INITIALIZATION SCRIPT -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const RENDER_BACKEND = "https://kuber-tjn2.onrender.com";
            const LOCAL_BACKEND = "http://localhost:8006";
            const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                ? LOCAL_BACKEND : RENDER_BACKEND;

            // Official Clerk Initialization Pattern

            const publishableKey = "pk_test_ZW1lcmdpbmctbXV0dC04LmNsZXJrLmFjY291bnRzLmRldiQ";
            const clerkDomain = atob(publishableKey.split('_')[2]).slice(0, -1);

            try {
                // Dynamically load @clerk/ui bundle
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = `https://${clerkDomain}/npm/@clerk/ui@1/dist/ui.browser.js`;
                    script.async = true;
                    script.crossOrigin = 'anonymous';
                    script.onload = resolve;
                    script.onerror = () => reject(new Error('Failed to load @clerk/ui bundle'));
                    document.head.appendChild(script);
                });

                // Initialize Clerk Object
                const clerk = new window.Clerk(publishableKey);
                await clerk.load({
                    ui: { ClerkUI: window.__internal_ClerkUICtor },
                    appearance: {
                        variables: {
                            colorPrimary: '#06C167',
                            colorBackground: '#141414',
                            colorText: '#FFFFFF',
                            colorTextSecondary: '#A6A6A6',
                            colorInputBackground: '#1c1c1c',
                            colorInputText: '#FFFFFF'
                        }
                    }
                });

                // Handle Auth State Switch
                if (clerk.user || clerk.isSignedIn) {
                    document.getElementById('auth-viewport').style.display = "none";
                    document.getElementById('dashboard-viewport').style.display = "flex";

                    const userButtonDiv = document.getElementById('user-button');
                    if (userButtonDiv) clerk.mountUserButton(userButtonDiv);

                    // Sync User with FastAPI Backend
                    const user = clerk.user;
                    if (user) {
                        fetch(`${API_BASE}/auth/clerk-sync`, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                clerk_user_id: user.id,
                                email: user.primaryEmailAddress ? user.primaryEmailAddress.emailAddress : "user@clerk.dev",
                                full_name: user.fullName || user.firstName || "Clerk OAuth User",
                                role: "RIDER"
                            })
                        }).catch(e => {});
                    }

                    initMap();
                } else {
                    document.getElementById('auth-viewport').style.display = "flex";
                    document.getElementById('dashboard-viewport').style.display = "none";

                    const signInDiv = document.getElementById('sign-in');
                    if (signInDiv) clerk.mountSignIn(signInDiv);
                }

            } catch (err) {
                // CDN Fallback initialization if ui.browser.js fails
                if (window.Clerk) {
                    try {
                        await window.Clerk.load({ publishableKey: publishableKey });
                        if (window.Clerk.user) {
                            document.getElementById('auth-viewport').style.display = "none";
                            document.getElementById('dashboard-viewport').style.display = "flex";
                            const userButtonDiv = document.getElementById('user-button');
                            if (userButtonDiv) window.Clerk.mountUserButton(userButtonDiv);
                            initMap();
                        } else {
                            const signInDiv = document.getElementById('sign-in');
                            if (signInDiv) window.Clerk.mountSignIn(signInDiv);
                        }
                    } catch (e) {}
                }
            }

            // Leaflet Map Init
            let map = null;
            function initMap() {
                if (map) return;
                try {
                    map = L.map('leaflet-map', { zoomControl: false }).setView([19.0600, 72.8350], 13);
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
                    L.control.zoom({ position: 'bottomright' }).addTo(map);
                } catch(e) {}
            }
        });
    </script>
</body>
</html>
