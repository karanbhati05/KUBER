version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: kuber-redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.7.0
    container_name: kuber-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  mysql-mumbai:
    image: mysql:8.0
    container_name: kuber-mysql-mumbai
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: kuber_db_mumbai

  mysql-delhi:
    image: mysql:8.0
    container_name: kuber-mysql-delhi
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: kuber_db_delhi

  dispatch_engine:
    build:
      context: ./services/dispatch_engine
      dockerfile: Dockerfile
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka

  websocket_hub:
    build:
      context: ./services/websocket_hub
      dockerfile: Dockerfile

  surge_engine:
    build:
      context: ./services/surge_engine
      dockerfile: Dockerfile
    ports:
      - "8004:8004"

  verification_engine:
    build:
      context: ./services/verification_engine
      dockerfile: Dockerfile
    ports:
      - "8005:8005"

  auth_engine:
    build:
      context: ./services/auth_engine
      dockerfile: Dockerfile
    ports:
      - "8006:8006"

  api-gateway:
    image: nginx:alpine
    container_name: kuber-api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dispatch_engine
      - websocket_hub
      - surge_engine
      - verification_engine
      - auth_engine




