events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # Upstream pool for FastAPI Dispatch Engine instances (HTTP Load Balancing)
    upstream dispatch_backend {
        # Round-robin load balancing across dispatch engine instances
        server dispatch_engine:8001;
    }

    # Upstream pool for WebSocket Hub
    upstream websocket_backend {
        server websocket_hub:8002;
    }

    # Upstream pool for Surge Pricing Engine
    upstream surge_backend {
        server surge_engine:8004;
    }

    # Upstream pool for Driver Verification Engine
    upstream verification_backend {
        server verification_engine:8005;
    }

    # Upstream pool for Auth & RBAC Engine
    upstream auth_backend {
        server auth_engine:8006;
    }

    server {
        listen 80;
        server_name localhost;

        # API Gateway Health Check Endpoint
        location /health {
            default_type application/json;
            return 200 '{"status": "healthy", "gateway": "KUBER Nginx API Gateway"}';
        }

        # Route requests to Auth & RBAC Engine
        location /auth/ {
            proxy_pass http://auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # HTTP Load Balancing for FastAPI Dispatch Engine
        location /ride/ {
            proxy_pass http://dispatch_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # Route requests to ML Surge Pricing Engine
        location /surge/ {
            proxy_pass http://surge_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route requests to Driver Verification Engine (Biometrics)
        location /verify/ {
            proxy_pass http://verification_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 10M;
        }

        # WebSocket Reverse Proxy for WebSocket Hub
        location /ws/ {
            proxy_pass http://websocket_backend;

            # HTTP 1.1 + Upgrade headers for WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Prevent connection drops during idle telemetry periods
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}


